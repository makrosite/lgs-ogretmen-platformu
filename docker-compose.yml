services:
  postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lgs_gizli_sifre_degistir}
      POSTGRES_DB: ${POSTGRES_DB:-lgs_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  next-app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-80}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-lgs_gizli_sifre_degistir}@postgresql:5432/${POSTGRES_DB:-lgs_db}
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      postgresql:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
